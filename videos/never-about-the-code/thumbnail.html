<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>never-about-the-code thumbnail</title>
<style>
  /* The YouTube thumbnail, 1280 by 720 (bin/package.mjs renders it). The video's own look: signal's near-black and
     highlighter, the archive's sepia for the 1950s half. Grace Hopper's photo is public domain (US Navy, James S. Davis),
     fetched by the build into assets/portraits/. */
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; src: url("../../themes/signal/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("../../themes/signal/fonts/inter-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Courier Prime"; font-weight: 700; src: url("../../themes/archive/fonts/courier-prime-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b0c10; }
  .then { position: absolute; left: 0; top: 0; bottom: 0; width: 470px; overflow: hidden; background: #2a1f14; }
  .then img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; filter: grayscale(1) sepia(0.9) contrast(1.15) brightness(0.9); }
  .then::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, #0b0c10 100%), radial-gradient(120% 90% at 40% 35%, transparent 55%, rgba(20, 12, 4, 0.75) 100%); }
  .year { position: absolute; left: 30px; bottom: 28px; z-index: 2; font-family: "Courier Prime", monospace; font-weight: 700; font-size: 34px; line-height: 1.15; color: #f6eedb; letter-spacing: 0.04em; text-shadow: 0 4px 18px rgba(0, 0, 0, 0.8); }
  .now { position: absolute; left: 430px; right: 52px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .quote { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 76px; white-space: nowrap; line-height: 1; letter-spacing: -0.01em; color: #ff5d4d; text-transform: uppercase; }
  .big { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 112px; line-height: 0.95; letter-spacing: -0.02em; color: #f6f5f1; text-transform: uppercase; }
  .big em { font-style: normal; color: #0b0c10; background: #ffd43b; padding: 0 16px; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
</style>
</head>
<body>
  <div class="then"><img src="assets/portraits/Commodore_Grace_M._Hopper_USN_covered_head_and_shoulders_crop-3fddad10.jpg" alt=""></div>
  <div class="year">Grace Hopper</div>
  <div class="now">
    <div class="big">Compilers got <em>roasted</em> too</div>
    <div class="quote">Now it's AI's turn</div>
  </div>
</body>
</html>
