<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>weight-space thumbnail</title>
<style>
  /* The YouTube thumbnail, 1280 by 720 (bin/package.mjs renders it). The picture is the video's own generated operating
     table (assets/gen/ws-theatre-image.png, gitignored; generated/theatre.txt remakes it). Every word is drawn here. It says
     the undisputed fact the video is about, framed the way the video frames it (an AI operating on another AI's weights),
     and asks the question that makes it strange: no training at all. The title says "edited its weights by hand"; the
     thumbnail does not repeat it. */
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("../../themes/redline/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; position: relative; }
  .pic { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; object-position: 60% 70%; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6, 22, 20, 0.95) 0%, rgba(6, 22, 20, 0.8) 34%, rgba(6, 22, 20, 0.1) 62%, transparent 75%); }
  .words { position: absolute; left: 48px; top: 54px; font-family: "Space Grotesk", sans-serif; font-weight: 700; text-transform: uppercase; color: #fff; line-height: 0.92; letter-spacing: -0.03em;
    text-shadow: 0 6px 0 rgba(0, 0, 0, 0.5), 0 10px 40px rgba(0, 0, 0, 0.8); }
  .a { font-size: 150px; color: #7ff5dc; }
  .b { font-size: 150px; }
  .c { font-size: 70px; color: #ff6a5c; margin-top: 18px; letter-spacing: 0; }
  .bubble { position: absolute; left: 600px; top: 470px; background: #fff; border-left: 14px solid #6d4cff; border-radius: 14px; padding: 18px 30px 22px; transform: rotate(-4deg);
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 74px; color: #1f1d1a; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
  .bubble small { display: block; font-size: 26px; color: #6d4cff; letter-spacing: 0.02em; margin-bottom: 2px; }
</style>
</head>
<body>
  <img class="pic" src="assets/gen/ws-theatre-image.png" alt="">
  <div class="fade"></div>
  <div class="words"><div class="a">AI brain</div><div class="b">surgery</div><div class="c">on another AI</div></div>
  <div class="bubble"><small>you</small>no training?!</div>
</body>
</html>
