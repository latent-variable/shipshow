<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eth-is-false thumbnail</title>
<style>
  /* The YouTube thumbnail, 1280 by 720 (bin/package.mjs renders it), in the video's chalk look. The picture is the video's own
     chart (scenes 05 and 08): every algorithm before was a straight line on this scale, ETH said there is a floor under their
     slopes, and the new curve bends under it. A schematic, as on screen: shapes, not scale. */
  @font-face { font-family: "Fraunces"; font-weight: 600; src: url("../../themes/chalk/fonts/fraunces-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../themes/chalk/fonts/nunito-latin-800-normal.woff2") format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { background: radial-gradient(ellipse 85% 75% at 62% 45%, #2b3d36 0%, #1b2723 58%, #101714 100%); position: relative; }
  body::after { content: ""; position: absolute; inset: 0; background: radial-gradient(130% 100% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.55) 100%); }
  .chart { position: absolute; right: 24px; top: 50px; width: 620px; height: 620px; }
  .chart path, .chart line { fill: none; stroke-linecap: round; }
  .words { position: absolute; left: 60px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 30px; z-index: 2; }
  .big { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 116px; line-height: 0.98; white-space: nowrap; letter-spacing: -0.02em; color: #f2f0e6; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6); }
  .big em { font-style: normal; color: #ffd66b; }
  .tag { align-self: flex-start; font-family: "Nunito", sans-serif; font-weight: 800; font-size: 58px; line-height: 1; white-space: nowrap; color: #121a17; background: #f6a1b8; padding: 14px 26px; border-radius: 14px; transform: rotate(-2deg); }
</style>
</head>
<body>
  <svg class="chart" viewBox="0 0 700 640">
    <line x1="60" y1="590" x2="680" y2="590" stroke="#b9c5bd" stroke-width="5" opacity="0.7"/>
    <line x1="60" y1="590" x2="60" y2="30" stroke="#b9c5bd" stroke-width="5" opacity="0.7"/>
    <!-- the old algorithms: straight lines -->
    <line x1="60" y1="590" x2="560" y2="40" stroke="#f2f0e6" stroke-width="7" opacity="0.45"/>
    <line x1="60" y1="590" x2="680" y2="150" stroke="#f2f0e6" stroke-width="7" opacity="0.55"/>
    <line x1="60" y1="590" x2="680" y2="250" stroke="#f2f0e6" stroke-width="7" opacity="0.7"/>
    <!-- ETH's floor -->
    <line x1="60" y1="590" x2="680" y2="345" stroke="#ff8f84" stroke-width="8" stroke-dasharray="22 16"/>
    <!-- the new curve: always rising, steeper than the floor at first, bending under it later -->
    <path d="M60 590 C 170 440, 380 425, 680 392" stroke="#ffd66b" stroke-width="13"/>
  </svg>
  <div class="words">
    <div class="big">A 25-year<br>floor,<br><em>gone?</em></div>
    <div class="tag">No human authors</div>
  </div>
</body>
</html>
