name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: a PR title carries the docs override
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A static ffmpeg, pinned by hash. apt-get stalled on the Ubuntu mirror for 26 and 33
      # minutes on 2026-10-26 (most runs take under a minute); this download takes seconds.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          curl -sSfL --retry 3 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/old-releases/ffmpeg-6.0.1-amd64-static.tar.xz
          echo "28268bf402f1083833ea269331587f60a242848880073be8016501d864bd07a5  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m 0755 /tmp/ffmpeg-6.0.1-amd64-static/ffmpeg /tmp/ffmpeg-6.0.1-amd64-static/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - run: npm ci
      - run: npm test
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # The default security gate (scripts/audit-deps.sh, scripts/audit-code.sh). Carried
  # advisories and their reasons: osv-scanner.toml.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs the merge base with the default branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install osv-scanner, Semgrep and gitleaks
        run: |
          curl -sSfL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum -c -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          pip install semgrep==1.181.0
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - run: bash scripts/audit-deps.sh
      - run: bash scripts/audit-code.sh
